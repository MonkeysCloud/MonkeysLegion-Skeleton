# ═══════════════════════════════════════════════════════════════════════════════
# MonkeysLegion v2 — Nginx Configuration
# ═══════════════════════════════════════════════════════════════════════════════

# Redirect HTTP to upstream framework front controller

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    # Upload size — match php.ini
    client_max_body_size 50M;

    # ── Main rewrite: try static file, then hand to index.php ────────────────
    location / {
        try_files $uri $uri/ /index.php;
    }

    # ── PHP-FPM fastcgi ───────────────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        include fastcgi_params;
        fastcgi_read_timeout 120;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # ── Deny access to sensitive files ────────────────────────────────────────
    location ~ /\.(?!.*\.well-known).* {
        deny all;
    }

    location ~ ^/(composer\.(json|lock|phar)|package\.json|package-lock\.json|\.env|\.env\.example|server\.php|bootstrap\.php)$ {
        deny all;
    }

    # ── Vite dev server assets are served directly by Node:5173 ───────────────
    # In production mode, assets live under /build/ and are served as static files.
    location /build/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Static file caching ───────────────────────────────────────────────────
    location ~* \.(css|js|jpg|jpeg|png|gif|svg|ico|woff|woff2|ttf|eot|map)$ {
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
        access_log off;
    }
}
